[project]
name = "xctrack-sbb-data"
version = "0.1.0"
description = "ETL for the XCTrack SBB widget stop dataset"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "requests>=2.32",
    "rasterio>=1.3",
    "scipy>=1.13",
]

[tool.uv]
package = false

# `tables` is optional on purpose: build_stops.py must stay installable without
# a JVM. r5py pulls in jpype1 + geopandas and needs Java 21 on PATH.
[dependency-groups]
dev = ["pytest>=8.0"]
tables = ["r5py>=1.1,<2", "geopandas>=1.0", "shapely>=2.0"]
